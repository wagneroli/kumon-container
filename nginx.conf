upstream flask_api {
    server kumon-api:5000;
}

upstream phpmyadmin {
    server kumon-phpmyadmin:80;
}

# ============================================
# HTTP Server (localhost e dominio)
# ============================================
server {
    listen 80;
    server_name kumon.tuaregbr.com.br localhost;

    # Para localhost, servir direto HTTP
    root /usr/share/nginx/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Aumentar timeout para uploads grandes
    client_max_body_size 100M;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # ============================================
    # PRIORITAR /phpmyadmin/* - com rewrite
    # ============================================
    location /phpmyadmin {
        rewrite ^/phpmyadmin(/.*)$ $1 break;
        proxy_pass http://phpmyadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /phpmyadmin;
        proxy_redirect off;
        proxy_cookie_path / /phpmyadmin/;
    }

    # ============================================
    # ATALHO /pma - com rewrite
    # ============================================
    location /pma {
        rewrite ^/pma(/.*)$ $1 break;
        proxy_pass http://phpmyadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pma;
        proxy_redirect off;
        proxy_cookie_path / /pma/;
    }

    # ============================================
    # DEPOIS vem /api/*
    # ============================================
    location /api/ {
        proxy_pass http://flask_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ============================================
    # Cache para arquivos estaticos
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ============================================
    # Bloquear acesso a arquivos sensiveis
    # ============================================
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }

    # ============================================
    # POR ULTIMO: arquivos estaticos e SPA
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}